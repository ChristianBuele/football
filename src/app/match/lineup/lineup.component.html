<div style=" max-width: 1000px; " *ngIf="show" class="flex flex-column" >
    <div class="col-12 bg-pink-700 text-3xl font-bold text-center border-round-md mb-1">
        {{team?team.name:'' |uppercase}}
    </div>
    <div class="vidrio flex justify-content-center align-content-center flex-wrap shadow-8 border-round-md ">
        <div class="w-6">
            <div class="font-bold  py-1 text-center" [ngClass]="{'titulares-enter-active': mostrarTitulares}">
                <p-divider >
                    <div class="inline-flex align-items-center">
                        <i class="pi pi-users mr-2"></i>
                        <b class="text-9xl">Equipo</b>
                    </div>
                </p-divider>
            </div>
            <div class="col-12">
                <div *ngFor="let player of titulares" class="py-1 text-xl font-bold text-center" 
                    [ngClass]="{'titulares-enter-active': mostrarTitulares}">
                    <label class="">{{player.number!=0 ?player.number+". ":" "}}</label>
                    <span >{{player.name}}</span>
                </div>
            </div>
            <div class="font-bold  py-1 " [ngClass]="{'suplentes-enter-active': mostrarSuplentes}" *ngIf="suplentes.length>0">
                <p-divider >
                    <div class="inline-flex align-items-center ">
                        <i class="pi pi-users mr-2"></i>
                        <b class="text-9xl">Suplentes</b>
                    </div>
                </p-divider>
            </div>
            <div class="col-12">
                <div *ngFor="let player of suplentes" class="py-1 text-xl font-bold text-center"
                    [ngClass]="{'suplentes-enter-active': mostrarSuplentes}">
                    <label class="">{{player.number!=0 ?player.number+". ":" "}}</label>
                    <span class="ml-2 w-12">{{player.name}}</span>
                </div>
            </div>
        </div>

        <div class="w-6 border-left-2 ">
            <div class="flex justify-content-center align-content-center flex-wrap " style="height: 100%">
                <div class="flex align-items-center justify-content-center font-bold border-round m-2 text-center " style="min-height: 500px; max-width: 500px;">
                    <p-image [src]="team?.image_path" [alt]="team?.name" width="300px"></p-image>
                </div>
               
            </div>
        </div>
    </div>

</div>
