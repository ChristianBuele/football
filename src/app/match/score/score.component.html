<div  class="flex flex-row flex-wrap  sombra bottom-center mb-4 transition-all animation-duration-1000	" *ngIf="show">
    <div class="w-12 flex justify-content-center text-3xl font-bold bg-pink-700 mb-1">
        Gol de {{scoreData.team.name |uppercase}}
    </div>
    <div class="flex justify-content-center w-12 text-2xl mb-2 surface-ground text-white font-bold">
        {{scoreData.player.number!=0?scoreData.player.number:"-"}}. {{scoreData.player.name}}
    </div>
</div>
